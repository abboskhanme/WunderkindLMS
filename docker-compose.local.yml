# SchoolLms — LOKAL (mac / Apple Silicon) uchun qo'shimcha sozlama.
# Prod faylga TEGMAYDI; ustiga qo'shib ishlatiladi:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   → http://localhost:8080
#
# Uchta farq bor:
#   1) app porti localhost'ga ochiladi (prodda ochilmaydi — u yerga faqat tunnel kiradi).
#   2) cloudflared / mediamtx / backup lokalda kerak emas — profil ortiga olinadi.

#   3) Baza rollari (SPEC §4.1) lokalda ham xuddi prodagidek: ilova `app_rw`, migratsiya
#      `schoollms_owner`. Lokal xatti-harakat prodnikidan farq qilsa, "menda ishlagan edi"
#      xatolari aynan shu yerdan chiqadi.
#      MAVJUD lokal bazangizda rollar yo'q — `deploy/init-roles.sql` ni bir marta qo'lda
#      qo'llang (deploy/README.md § "Mavjud bazaga rollarni qo'llash").
#      `docker compose down -v` QILMANG — u lokal bazani butunlay o'chiradi.

services:
  database:
    ports:
      - "5432:5432"          # psql / TablePlus bilan ulanish uchun

  backend:
    ports:
      - "8080:8080"
    environment:
      # Prodda `test.<domen>` faqat o'sha hostda SPA ochadi; lokalda host = localhost.
      App__Host: "localhost"
      Tenancy__RootDomain: "localhost"

  cache:
    ports:
      # FAQAT localhost — `redis-cli -p 6379 MONITOR` bilan keshni kuzatish uchun.
      # Prodda bu port umuman ochilmaydi.
      - "127.0.0.1:6379:6379"

  # Quyidagilar lokalda avtomatik ko'tarilmaydi.
  # Kerak bo'lsa: `--profile tunnel` / `--profile media` / `--profile backup` qo'shing.
  cloudflared:
    profiles: ["tunnel"]

  mediamtx:
    profiles: ["media"]

  backup:
    profiles: ["backup"]
