# SchoolLms — LOKAL (mac / Apple Silicon) uchun qo'shimcha sozlama.
# Prod faylga TEGMAYDI; ustiga qo'shib ishlatiladi:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   → http://localhost:8080
#
# Uchta farq bor:
#   1) app porti localhost'ga ochiladi (prodda ochilmaydi — u yerga faqat tunnel kiradi).
#   2) cloudflared / mediamtx / backup lokalda kerak emas — profil ortiga olinadi.

#   3) Baza rollari (SPEC §4.1) lokalda ham xuddi prodagidek: ilova `app_rw`, migratsiya
#      `schoollms_owner`. Lokal xatti-harakat prodnikidan farq qilsa, "menda ishlagan edi"
#      xatolari aynan shu yerdan chiqadi.
#      MAVJUD lokal bazangizda rollar yo'q — `deploy/init-roles.sql` ni bir marta qo'lda
#      qo'llang (deploy/README.md § "Mavjud bazaga rollarni qo'llash").
#      `docker compose down -v` QILMANG — u lokal bazani butunlay o'chiradi.

services:
  database:
    ports:
      - "5432:5432"          # psql / TablePlus bilan ulanish uchun

  backend:
    ports:
      - "8080:8080"
    environment:
      # Prodda `test.<domen>` faqat o'sha hostda SPA ochadi; lokalda host = localhost.
      App__Host: "localhost"
      Tenancy__RootDomain: "localhost"

  cache:
    ports:
      # FAQAT localhost — `redis-cli -p 6379 MONITOR` bilan keshni kuzatish uchun.
      # Prodda bu port umuman ochilmaydi.
      - "127.0.0.1:6379:6379"

  # Quyidagilar lokalda avtomatik ko'tarilmaydi.
  # Kerak bo'lsa: `--profile tunnel` / `--profile media` / `--profile backup` qo'shing.
  cloudflared:
    profiles: ["tunnel"]

  mediamtx:
    profiles: ["media"]

  backup:
    profiles: ["backup"]

  # ---------------------------------------------------------------------------
  #  Frontend dev serveri — ixtiyoriy, `--profile dev` bilan ishga tushadi.
  #
  #  NEGA KERAK: `backend` konteyneri ishlab chiqarish uslubida qurilgan —
  #  Dockerfile React ilovasini `wwwroot` ga muhrlaydi, ya'ni HAR BIR frontend
  #  o'zgarishi butun image'ni qayta qurishni talab qiladi (2-3 daqiqa). Bu
  #  servis o'rniga manbani MOUNT qiladi va Vite dev serverini yuritadi:
  #  o'zgarish brauzerda darrov ko'rinadi, qayta qurish kerak emas.
  #
  #    docker compose -f docker-compose.yml -f docker-compose.local.yml \
  #      --profile dev up -d client-dev      → http://localhost:5173
  #
  #  Backend (`/api`, `/hubs`, `/uploads`) shu yerdan `backend` konteyneriga
  #  yo'naltiriladi, ya'ni baza va API o'zgarmaydi. BACKEND kodi (.cs)
  #  o'zgarsa — u hamon qayta qurishni talab qiladi, bu faqat frontend uchun.
  # ---------------------------------------------------------------------------
  client-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./schoollms.client:/app
      - client_dev_modules:/app/node_modules
    environment:
      DEV_IN_DOCKER: "1"
      DEV_API_TARGET: "http://backend:8080"
      DEV_SERVER_PORT: "5173"
    ports:
      - "5173:5173"
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  client_dev_modules:
