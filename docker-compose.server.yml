# SchoolLms — serverga deploy uchun qo'shimcha sozlama (Cloudflare + Caddy).
#
# Prod faylga tegmaydi; ustiga qo'shib ishlatiladi:
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d --build
#   → https://lms.wunderkindedu.uz  (Cloudflare orqali)
#
# Asosiy fayldan farqi:
#   1) Tashqariga Caddy chiqadi (80 va 443), ilova konteyneri emas.
#   2) App__Host bo'sh: istalgan host (domen ham, IP ham) SPA'ni ochadi.
#   3) cloudflared va mediamtx profil ortida — bu yerda kerak emas, RAM tejaydi.
#   4) PostgreSQL xotira sozlamalari serverga moslangan (3 GB RAM).

services:
  database:
    # 3 GB RAM — PostgreSQL uchun mo'tadil sozlama.
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1GB
               -c work_mem=8MB -c maintenance_work_mem=128MB -c max_connections=60

  backend:
    # `ports` YO'Q — ilovaga faqat Caddy (ichki tarmoq) kiradi.
    #
    # ULANISH SATRLARI asosiy fayldan keladi va bu yerda ATAYLAB qayta yozilmaydi:
    #   Default  = app_rw           (ilova — hech narsaga ega emas)
    #   Migrator = schoollms_owner  (sxema egasi — faqat migratsiya)
    # Ikkalasi ham .env dagi DB_APP_PASSWORD / DB_MIGRATOR_PASSWORD ni talab qiladi.
    # Agar Default ni `schoollms` ga qaytarsangiz, SPEC §4.1 moliyaviy himoyasi
    # HECH QANDAY XATOSIZ, jimgina ishlamay qoladi. Tekshirish usuli: deploy/README.md.
    environment:
      # Bo'sh qiymat = har qanday host ilovani ochadi (landing sahifa emas).
      App__Host: ""
      Tenancy__RootDomain: ""
      # Chek QR kodi ichidagi manzil (2026-09-24): {asos}/r/{token}. Telegram'ga yuboriladigan PDF ham shuni ishlatadi.
      Receipts__PublicBaseUrl: "https://lms.wunderkindedu.uz"

  # ── PROKSI ── Caddy: 80/443 ni tinglaydi, Cloudflare'dan kelgan trafikni backend'ga uzatadi.
  proxy:
    image: caddy:2-alpine
    container_name: wunderkind-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # sertifikatlar va ichki CA — deploylar oralig'ida saqlanadi
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy   # backend TAYYOR bo'lgandan keyin trafik qabul qilinadi
    healthcheck:
      # Haqiqiy yo'lni tekshiradi: proxy → backend → baza. Caddy admin API (:2019)
      # `admin off` bilan o'chirilgan, shuning uchun uni tekshirib bo'lmaydi —
      # va u faqat konfiguratsiya yuklanganini bildirardi, xizmat ishlayotganini emas.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:80/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # Log rotatsiyasi (asosiy fayldagi anchor fayllar orasida ko'rinmaydi — shu yerda takrorlanadi).
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Demo uchun kerak emas — RAM va disk tejaladi.
  # Kerak bo'lsa: `--profile media` / `--profile tunnel` qo'shing.
  mediamtx:
    profiles: ["media"]

  cloudflared:
    profiles: ["tunnel"]

volumes:
  caddy-data:
  caddy-config:
