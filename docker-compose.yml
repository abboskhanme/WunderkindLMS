# SchoolLms — prod: app (API + SPA) + PostgreSQL + Cloudflare Tunnel.
# Sozlamalar .env faylidan keladi (.env.example dan nusxa oling).
# Diqqat: app porti TASHQARIGA OCHILMAGAN — unga faqat cloudflared (ichki tarmoq) kiradi.

services:
  postgres:
    image: postgres:17-alpine
    container_name: schoollms-db
    environment:
      POSTGRES_DB: "schoollms"
      POSTGRES_USER: "schoollms"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      # Kirill/lotin tartiblash uchun
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoollms -d schoollms"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        VITE_ROOT_DOMAIN: "${ROOT_DOMAIN}"   # frontend subdomenni shu domenga nisbatan aniqlaydi
        VITE_USE_MOCK: "false"
    container_name: schoollms-app
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=schoollms;Username=schoollms;Password=${DB_PASSWORD};Include Error Detail=true"
      Tenancy__RootDomain: "${ROOT_DOMAIN}"
      App__Host: "test.${ROOT_DOMAIN}"     # FAQAT shu host ilovani (SPA) ochadi; qolganlari → landing
      Jwt__Key: "${JWT_KEY}"               # >=32 belgi; prod'da MAJBURIY
    volumes:
      - uploads:/app/uploads               # yuklangan fayllar (rasm, hujjat) saqlanadi
      - dpkeys:/app/keys                    # DataProtection kalitlari — deploylar oralig'ida saqlanadi
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Diqqat: bu yerda `ports:` YO'Q — internetga ochilmaydi.

  # Kamera media-shlyuzi: IP kameralar RTSP oqimini brauzer ko'radigan HLS ga o'giradi,
  # 24/7 yozib boradi (playback + qirqib yuklab olish uchun). Tashqariga OCHILMAGAN —
  # unga faqat `app` (ichki tarmoq) kiradi; brauzer app proksi orqali ko'radi.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: schoollms-mediamtx
    environment:
      MTX_API: "yes"                 # konfiguratsiya API (:9997) — app kamera yo'llarini qo'shadi
      MTX_HLS: "yes"                 # jonli HLS (:8888)
      MTX_PLAYBACK: "yes"            # yozuvdan playback/clip (:9996)
      MTX_HLSVARIANT: "mpegts"       # oddiy .ts segmentlar — proksilash oson
      MTX_PATHDEFAULTS_RECORDPATH: "/recordings/%path/%Y-%m-%d_%H-%M-%S-%f"
    volumes:
      - cam-recordings:/recordings   # kamera yozuvlari (playback manbai)
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: schoollms-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN}"      # Cloudflare Zero Trust → Tunnels → token
      # QUIC (UDP) edge ulanishi tez-tez uzilib ("no recent network activity") tunnel butunlay
      # tushib qolardi → 5xx. HTTP/2 (TCP) ga o'tkazamiz — bu tarmoqda barqarorroq.
      TUNNEL_TRANSPORT_PROTOCOL: "http2"
    depends_on:
      - app
    restart: unless-stopped

  # Kunlik avtomatik backup. Har kuni BACKUP_HOUR (UTC) da BARCHA foydalanuvchi bazalarini
  # /backups ga .bak qilib oladi va BACKUP_RETENTION_DAYS dan eski nusxalarni o'chiradi.
  # Kunlik avtomatik backup. Har kuni BACKUP_HOUR (UTC) da bazani /backups ga .dump qilib
  # oladi va BACKUP_RETENTION_DAYS dan eski nusxalarni o'chiradi.
  backup:
    image: postgres:17-alpine
    container_name: schoollms-backup
    environment:
      PGHOST: postgres
      PGUSER: schoollms
      PGPASSWORD: "${DB_PASSWORD}"
      PGDATABASE: schoollms
      BACKUP_HOUR: "21"            # 21:00 UTC = 02:00 Toshkent
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - pg-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] xizmat ishga tushdi; har kuni $${BACKUP_HOUR}:00 UTC, saqlash $${BACKUP_RETENTION_DAYS} kun"
        while true; do
          now=$$(date -u +%s)
          next=$$(date -u -d "today $${BACKUP_HOUR}:00" +%s 2>/dev/null || date -u +%s)
          [ "$$next" -le "$$now" ] && next=$$(( next + 86400 ))
          sleep $$(( next - now ))
          ts=$$(date -u +%Y%m%d_%H%M)
          echo "[backup] $$ts — boshlandi"
          pg_dump --format=custom --file="/backups/schoollms_$${ts}.dump" && echo "[backup] tayyor" || echo "[backup] XATO"
          find /backups -name '*.dump' -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete
        done

volumes:
  pg-data:
  uploads:
  dpkeys:
  pg-backups:
  cam-recordings:
