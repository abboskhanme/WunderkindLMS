<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>O'qituvchi kabineti</title>
    <script>
      // Opened BY TELEGRAM as a Mini App (launch data #tgWebApp… in the hash): the teacher's Telegram
      // panel is the Mini App at /tg/ — the same one every teacher gets (client, 2026-10-08). A normal
      // browser or the installed PWA has no such hash and is not touched.
      (function () {
        var h = location.hash || ''
        if (h.indexOf('tgWebAppData=') !== -1 || h.indexOf('tgWebAppPlatform=') !== -1) {
          location.replace('/tg/' + location.search + h)
        }
      })()
    </script>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07120f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="icon-180.png" />

    <!-- iOS standalone (app holatida ochilishi) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="O'qituvchi" />
